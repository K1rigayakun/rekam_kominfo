version: '3.8'

services:
  # ─── DATABASE ─────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: rekam_db
    restart: always
    environment:
      POSTGRES_USER: rekam_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecretPassword123!}
      POSTGRES_DB: rekam_prod
    volumes:
      - rekam_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - rekam_net

  # ─── CACHE & QUEUE ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rekam_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-SecretRedis123!} --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - rekam_redisdata:/data
    ports:
      - "6379:6379"
    networks:
      - rekam_net

  # ─── OBJECT STORAGE ────────────────────────
  minio:
    image: minio/minio
    container_name: rekam_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-rekam_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-SecretMinio123!@#}
    volumes:
      - rekam_miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - rekam_net

  # ─── INITIALIZE MINIO BUCKETS ──────────────
  minio-init:
    image: minio/mc
    container_name: rekam_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-rekam_minio_admin} ${MINIO_SECRET_KEY:-SecretMinio123!@#};
      mc mb myminio/rekam-raw --ignore-existing;
      mc mb myminio/rekam-processed --ignore-existing;
      mc mb myminio/rekam-attach --ignore-existing;
      mc mb myminio/rekam-exports --ignore-existing;
      "
    networks:
      - rekam_net

volumes:
  rekam_pgdata:
  rekam_redisdata:
  rekam_miniodata:

networks:
  rekam_net:
    driver: bridge
