# Rekam Nginx Configuration for Production
# Lokasi: /etc/nginx/sites-available/rekam

# Rate limiting zones
limit_req_zone  $binary_remote_addr zone=public_api:10m  rate=10r/s;
limit_req_zone  $binary_remote_addr zone=auth_api:10m    rate=1r/s;
limit_conn_zone $binary_remote_addr zone=upload_conn:10m;

# ==========================================
# SERVER BLOCK: REKAM ADMIN (rekam.kominfo.co.id)
# ==========================================
server {
    listen 80;
    server_name rekam.kominfo.co.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rekam.kominfo.co.id;

    # SSL Certificate (Dihasilkan oleh Certbot nanti)
    # ssl_certificate     /etc/letsencrypt/live/rekam.kominfo.co.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/rekam.kominfo.co.id/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Upload: unlimited (tus handle chunking)
    client_max_body_size    0;
    client_body_buffer_size 10m;
    proxy_request_buffering off;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── tus Upload ───────────────────────────────────────
    location /api/upload/tus {
        limit_conn upload_conn 3;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward tus headers
        proxy_set_header Tus-Resumable     $http_tus_resumable;
        proxy_set_header Upload-Offset     $http_upload_offset;
        proxy_set_header Upload-Length     $http_upload_length;
        proxy_set_header Upload-Metadata   $http_upload_metadata;
        proxy_pass_header Upload-Offset;
        proxy_pass_header Tus-Resumable;
    }

    # ── Auth (rate limit ketat) ──────────────────────────
    location /api/auth {
        limit_req zone=auth_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Halaman Publik QR (Akses Foto & Video) ───────────
    location /share/ {
        limit_req zone=public_api burst=30 nodelay;
        limit_req_status 429;
        # CSP ketat untuk halaman publik
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; frame-ancestors 'none';" always;
        
        # Reverse Proxy Frontend SPA untuk path /share/
        root /opt/rekam/apps/web/dist;
        try_files $uri $uri/ /index.html;
    }

    # ── API umum ─────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static Frontend WEB (React SPA) ──────────────────
    location / {
        root /opt/rekam/apps/web/dist;
        try_files $uri $uri/ /index.html;
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}

# ==========================================
# SERVER BLOCK: REKAM MEDIA (media.rekam.kominfo.id)
# ==========================================
server {
    listen 80;
    server_name media.rekam.kominfo.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name media.rekam.kominfo.id;

    # SSL Certificate (Dihasilkan oleh Certbot nanti)
    # ssl_certificate     /etc/letsencrypt/live/media.rekam.kominfo.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/media.rekam.kominfo.id/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Static Frontend MEDIA-WEB (React SPA) ────────────
    location / {
        root /opt/rekam/apps/media-web/dist;
        try_files $uri $uri/ /index.html;
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
